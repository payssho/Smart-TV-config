# Réglages mémoire et stockage de la box, par profil de RAM (ADR 0020).
# Lu par tele-memoire (au démarrage) et tele-entretien (au repos).
# Le profil est choisi tout seul d'après la RAM vue par Linux ; on peut le
# forcer avec PROFIL=2go ou PROFIL=4go ci-dessous.
#
# Valeurs de départ, à reprendre avec les mesures du jumeau puis de la box.

# PROFIL=2go

# Seuil (Mo de MemTotal) sous lequel on applique le profil 2 Go.
SEUIL_PROFIL_2GO_MO=2600

profil_2go() {
  # zram : swap compressé en RAM. lz4 plutôt que zstd : un peu moins
  # compact, mais décompression bien plus rapide sur Cortex-A55, donc pas de
  # saccade quand une page revient.
  ZRAM_ALGO=lz4
  ZRAM_POURCENT=75
  # La carte SD est lente : mieux vaut compresser du tas inactif en RAM que
  # jeter du cache de fichiers qu'il faudra relire sur la SD.
  SWAPPINESS=100
  # kswapd se réveille plus tôt : moins de récupération directe, donc moins
  # d'à-coups dans l'interface quand la mémoire se tend.
  WATERMARK_SCALE_FACTOR=125
  # MGLRU : ne jamais évincer ce qui a servi dans la dernière seconde.
  # Sous forte pression, le noyau préfère tuer (Chromium d'abord) que ramer.
  LRU_GEN_MIN_TTL_MS=1000
  # Plafonds de stockage (issue #45), en Mo.
  CAP_CHROMIUM_MO=256
  CAP_MINIATURES_MO=150
  CAP_JOURNAL_MO=64
  CAP_TMP_MO=128
}

profil_4go() {
  ZRAM_ALGO=lz4
  ZRAM_POURCENT=25
  SWAPPINESS=60
  WATERMARK_SCALE_FACTOR=10
  LRU_GEN_MIN_TTL_MS=0
  CAP_CHROMIUM_MO=512
  CAP_MINIATURES_MO=300
  CAP_JOURNAL_MO=64
  CAP_TMP_MO=256
}

# Communs aux deux profils.
# zram ne lit pas en avance : une page à la fois.
PAGE_CLUSTER=0
# Écritures sur la SD par petits paquets : pas de longue écriture qui gèle
# le système (valeurs en octets).
DIRTY_BACKGROUND_OCTETS=16777216
DIRTY_OCTETS=67108864

# Entretien (tele-entretien) : il ne fait rien de coûteux tant que la télé
# sert. « Repos » = activité veille ou accueil, inchangée depuis REPOS_MIN
# minutes, et processeur comme SD presque inactifs (PSI avg10 sous les
# seuils, et processeur occupé à moins de CPU_MAX_POURCENT sur une seconde).
REPOS_MIN=5
PSI_CPU_MAX=10
PSI_IO_MAX=5
CPU_MAX_POURCENT=30
# Stockage /data : au-delà de SEUIL_VIDER on vide les caches, au-delà de
# SEUIL_ALERTE on prévient et on refuse les mises à jour (issue #45).
SEUIL_VIDER_POURCENT=75
SEUIL_ALERTE_POURCENT=90
# fstrim au plus une fois par semaine, et seulement en veille.
TRIM_JOURS=7

# Où vivent les caches (relatifs à la racine).
DOSSIER_DATA=/data
DOSSIER_CHROMIUM_CACHE=/data/chromium/Default/Cache
DOSSIER_MINIATURES=/data/miniatures
DOSSIER_TMP=/var/tmp/tele

# Score OOM par rôle : plus haut = tué en premier. L'interface et le hub
# domotique doivent survivre à tout ; Chromium part en premier.
OOM_INTERFACE=-900
OOM_HUB=-800
OOM_LECTEUR=-300
OOM_MISE_A_JOUR=300
OOM_CHROMIUM=800
