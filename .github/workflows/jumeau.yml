name: Jumeau de la box

# Fait tourner l'OS de la télé sur le jumeau numérique de la box (ADR 0019) :
# QEMU arm64, 4 × Cortex-A55, RAM de 2 Go puis 4 Go, microSD A1 bridée.
# Construit l'image arm64, puis joue le scénario sur les deux profils et
# publie le rapport.
#
# Runner : variable de dépôt JUMEAU_RUNNER, ubuntu-24.04 (x86) par défaut,
# car les runners arm64 sont payants sur un dépôt privé. Sur x86, l'image
# se construit par émulation (qemu-user) et sans l'app Flutter, que Flutter
# ne sait compiler pour arm64 que sur une machine arm64 : l'interface est
# alors remplacée par un bloc de 150 Mo. Avec JUMEAU_RUNNER=ubuntu-24.04-arm,
# l'app est compilée et embarquée.
on:
  pull_request:
    paths:
      - "systeme/**"
      - "scripts/jumeau/**"
      - ".github/workflows/jumeau.yml"
  schedule:
    # Chaque lundi à 4 h (heure de Paris en hiver) : suivi dans la durée.
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      scenario:
        description: "complet ou fumee"
        default: "complet"
      palier:
        description: "Durée d'un palier, en secondes"
        default: "60"

permissions:
  contents: read

concurrency:
  group: jumeau-${{ github.ref }}
  cancel-in-progress: true

env:
  SCENARIO: ${{ inputs.scenario || 'complet' }}
  PALIER: ${{ inputs.palier || '60' }}

jobs:
  image:
    name: Image arm64 du jumeau
    runs-on: ${{ vars.JUMEAU_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Outils (mmdebstrap, et qemu-user sur x86)
        # Un miroir apt injoignable bloquait ce pas jusqu'au plafond du job.
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y mmdebstrap debian-archive-keyring e2fsprogs zstd
          if [[ "$RUNNER_ARCH" != ARM64 ]]; then
            sudo apt-get install -y qemu-user-static binfmt-support
          fi
      - name: App Flutter pour arm64 (runner arm64 seulement)
        if: runner.arch == 'ARM64'
        run: |
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
          git clone --depth 1 -b 3.47.9 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          export PATH="$RUNNER_TEMP/flutter/bin:$PATH"
          cd ui
          flutter build linux --release --dart-define=TRACE_DEMARRAGE=true
          echo "APPLI=$PWD/build/linux/arm64/release/bundle" >>"$GITHUB_ENV"
      - name: Image Debian arm64 avec nos scripts système
        run: |
          args=(--sortie "$RUNNER_TEMP/image")
          if [[ -n "${APPLI:-}" ]]; then args+=(--appli "$APPLI"); fi
          scripts/jumeau/construire-image.sh "${args[@]}"
      - name: Empaqueter (disque creux)
        run: tar -C "$RUNNER_TEMP/image" -cSf - . | zstd -T0 -3 >"$RUNNER_TEMP/image.tar.zst"
      - uses: actions/upload-artifact@v4
        with:
          name: image-jumeau
          path: ${{ runner.temp }}/image.tar.zst
          compression-level: 0
          retention-days: 7

  jumeau:
    name: Jumeau ${{ matrix.profil }}
    needs: image
    runs-on: ${{ vars.JUMEAU_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        profil: [2go, 4go]
    steps:
      - uses: actions/checkout@v4
      - name: QEMU et ffmpeg
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm qemu-utils ffmpeg zstd e2fsprogs
          if [[ -e /dev/kvm ]]; then sudo chmod 666 /dev/kvm; fi
      - uses: actions/download-artifact@v4
        with:
          name: image-jumeau
          path: ${{ runner.temp }}
      - name: Déballer l'image
        run: |
          mkdir -p scripts/jumeau/.image
          zstd -dc "$RUNNER_TEMP/image.tar.zst" | tar -C scripts/jumeau/.image -xSf -
          cat scripts/jumeau/.image/image.txt
      - name: Scénario
        run: |
          scripts/jumeau/demarrer.sh --profil "${{ matrix.profil }}" --scenario "$SCENARIO" \
            --palier "$PALIER" --sortie resultats
      - name: Fin du journal de Chromium
        if: always()
        run: tail -n 40 resultats/chromium-*.log 2>/dev/null || echo "pas de journal Chromium"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jumeau-${{ matrix.profil }}
          path: resultats

  rapport:
    name: Rapport 2 Go / 4 Go
    needs: jumeau
    if: ${{ !cancelled() && needs.jumeau.result != 'skipped' && needs.jumeau.result != 'cancelled' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: jumeau-*
          path: resultats
          merge-multiple: true
      - name: Rapport
        run: |
          code=0
          mkdir -p resultats
          python3 scripts/jumeau/rapport.py resultats >resultats/rapport.md || code=$?
          cat resultats/rapport.md >>"$GITHUB_STEP_SUMMARY"
          # Aussi dans le journal du job, lisible sans télécharger l'artefact.
          cat resultats/rapport.md
          exit "$code"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapport-jumeau
          path: resultats
