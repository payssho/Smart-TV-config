name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: Lint shell
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          mapfile -t scripts < <(git ls-files '*.sh')
          shellcheck --version
          shellcheck "${scripts[@]}"
      - name: actionlint (workflows)
        uses: raven-actions/actionlint@v2

  docs:
    name: Docs et ADR
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: "**/*.md"
      - name: Cohérence des ADR
        run: scripts/ci/verifier-adr.sh

  flutter:
    name: Flutter (format, analyse, tests)
    runs-on: ubuntu-24.04
    # L'app Flutter TV arrive en phase 2 dans ui/ : les étapes s'activent
    # toutes seules dès que ui/pubspec.yaml existe (hashFiles n'est pas
    # permis dans le « if » d'un job, d'où le test au niveau des étapes).
    steps:
      - uses: actions/checkout@v4
      - name: Présence de l'app Flutter
        id: app
        run: |
          if [[ -f ui/pubspec.yaml ]]; then
            echo "presente=true" >>"$GITHUB_OUTPUT"
          else
            echo "presente=false" >>"$GITHUB_OUTPUT"
            echo "Pas encore de ui/pubspec.yaml : rien à vérifier."
          fi
      - uses: subosito/flutter-action@v2
        if: steps.app.outputs.presente == 'true'
        with:
          # Version figée, montée exprès dans une PR (ADR 0022) : même numéro dans
          # tous les workflows et dans ui/pubspec.yaml.
          channel: stable
          flutter-version: 3.50.0
          cache: true
      - name: Dépendances
        if: steps.app.outputs.presente == 'true'
        working-directory: ui
        run: flutter pub get
      - name: Format
        if: steps.app.outputs.presente == 'true'
        working-directory: ui
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyse
        if: steps.app.outputs.presente == 'true'
        working-directory: ui
        run: flutter analyze
      - name: Tests
        if: steps.app.outputs.presente == 'true'
        working-directory: ui
        run: flutter test
      - name: Prévisu web (ADR 0015)
        if: steps.app.outputs.presente == 'true'
        run: scripts/previsu/construire.sh
      - name: Publier la prévisu en artefact
        if: steps.app.outputs.presente == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: previsu-interface
          path: build/previsu
          retention-days: 14
