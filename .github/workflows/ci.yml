name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: Lint shell
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          mapfile -t scripts < <(git ls-files '*.sh' 'systeme/usr/sbin/*' 'scripts/jumeau/invite/tele-jumeau')
          shellcheck --version
          shellcheck -x "${scripts[@]}"
      - name: actionlint (workflows)
        uses: raven-actions/actionlint@v2

  systeme:
    name: Scripts système de la box (tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: tele-memoire, tele-entretien, tele-role sur une fausse racine
        run: systeme/tests/tester.sh
      - name: Les mêmes sous le sh de BusyBox (celui de Buildroot)
        timeout-minutes: 10
        run: |
          # Le paquet « busybox » et pas « busybox-static » déjà présent sur le
          # runner : la version statique d'Ubuntu exécute ses applets internes
          # avant le PATH, ce qui contourne les doublures des tests (df, sleep)
          # et ne ressemble pas au BusyBox de Buildroot. apt réessaie, car un
          # miroir injoignable a déjà fait échouer ce job.
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30
          sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout=30 busybox
          mkdir -p "$RUNNER_TEMP/bb"
          for c in awk find stat du df date sort head cat mkdir rm touch grep sed tr kill renice; do
            ln -sf "$(command -v busybox)" "$RUNNER_TEMP/bb/$c"
          done
          TELE_SH="busybox sh" PATH="$RUNNER_TEMP/bb:$PATH" systeme/tests/tester.sh

  docs:
    name: Docs et ADR
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: "**/*.md"
      - name: Cohérence des ADR
        run: scripts/ci/verifier-adr.sh

  flutter:
    name: Flutter (format, analyse, tests)
    runs-on: ubuntu-24.04
    # L'app Flutter TV arrive en phase 2 dans ui/ : les étapes s'activent
    # toutes seules dès que ui/pubspec.yaml existe (hashFiles n'est pas
    # permis dans le « if » d'un job, d'où le test au niveau des étapes).
    steps:
      - uses: actions/checkout@v4
      - name: Présence de l'app Flutter
        id: app
        run: |
          if [[ -f ui/pubspec.yaml ]]; then
            echo "presente=true" >>"$GITHUB_OUTPUT"
          else
            echo "presente=false" >>"$GITHUB_OUTPUT"
            echo "Pas encore de ui/pubspec.yaml : rien à vérifier."
          fi
      - uses: subosito/flutter-action@v2
        if: steps.app.outputs.presente == 'true'
        with:
          # Version figée : Flutter 3.50 rend package:flutter/material.dart
          # obsolète (material_ui) ; la migration de ui/ se fera dans sa PR.
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - name: Dépendances
        if: steps.app.outputs.presente == 'true'
        working-directory: ui
        run: flutter pub get
      - name: Format
        if: steps.app.outputs.presente == 'true'
        working-directory: ui
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyse
        if: steps.app.outputs.presente == 'true'
        working-directory: ui
        run: flutter analyze
      - name: Tests
        if: steps.app.outputs.presente == 'true'
        working-directory: ui
        run: flutter test
      - name: Prévisu web (ADR 0015)
        if: steps.app.outputs.presente == 'true'
        run: scripts/previsu/construire.sh
      - name: Publier la prévisu en artefact
        if: steps.app.outputs.presente == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: previsu-interface
          path: build/previsu
          retention-days: 14
