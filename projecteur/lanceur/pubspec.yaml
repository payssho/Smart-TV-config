name: lanceur
description: "Écran d'accueil « Veilleuse » du projecteur HY300 Pro, sous son Android d'origine (ADR 0025)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7
  # Même Flutter figé que l'app télé (ADR 0022).
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Bricolage
      fonts:
        - asset: assets/fonts/BricolageGrotesque-400.ttf
          weight: 400
        - asset: assets/fonts/BricolageGrotesque-600.ttf
          weight: 600
    - family: BricolageEtroite
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Condensed800.ttf
          weight: 800
